name: CI

# Runs on every push, every pull request and on the manual "Run workflow" button.
on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token. The pipeline needs no secrets and no cloud credentials.
permissions:
  contents: read

env:
  IMAGE_NAME: devops/week5-app

jobs:
  # ---------------------------------------------------------------- lint
  # Static checks only: style, unused imports, import order. Fast and cheap,
  # so it runs in parallel with the tests instead of waiting for them.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python with a pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------- test
  # The same tests run once per Python version in the matrix. A failing test
  # makes pytest exit non-zero, which fails this job and therefore the workflow.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with a pip cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest --junitxml=test-results/junit-py${{ matrix.python-version }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 14

  # ---------------------------------------------------------------- build
  # Only runs when lint and every matrix test job succeeded. Builds the
  # multi-stage image from Week 3, smoke tests it and records the image digest.
  build:
    name: Build image
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Docker layer cache stored in GitHub Actions cache, so unchanged
          # layers (base image, pip install) are reused between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name week5 -p 8000:8000 "$IMAGE_NAME:$GITHUB_SHA"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/healthz; then
              echo
              curl -fsS http://localhost:8000/
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker logs week5
          exit 1

      - name: Record the image digest
        run: |
          {
            echo "image=$IMAGE_NAME:$GITHUB_SHA"
            echo "image_id=${{ steps.build.outputs.imageid }}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "commit=$GITHUB_SHA"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > image-digest.txt
          cat image-digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 14
